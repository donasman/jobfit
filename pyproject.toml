[project]
name = "jobfit"
version = "0.2.6"
description = "공고 기반 자소서 파이프라인 — 스크립트가 보장하고 AI는 판단만 한다"
readme = "README.md"
authors = [
    { name = "donasman", email = "147610435+donasman@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.4",
    "pyperclip>=1.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/donasman/jobfit"

[project.scripts]
jobfit = "jobfit.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
