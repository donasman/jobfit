name: 공고 사이트가 안 돼요
description: 공고를 못 받거나 본문이 깨지는 채용 사이트 알리기 (공고 링크는 적지 마세요)
title: "[사이트] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 공고 링크는 붙여넣지 마세요

        채용 사이트 링크에는 **누가 눌렀는지 따라갈 수 있는 코드**가 붙어 있는 경우가 있습니다.
        그래서 여기에는 **사이트 이름과 증상만** 적어 주세요. 링크가 없어도 고칠 수 있습니다.

        이력서·자소서 내용, 이름·연락처, 회사명도 적지 마세요. 이슈는 누구나 볼 수 있습니다.

        > 원티드처럼 화면을 스크립트로 그리는 사이트, 그림·PDF 공고, `.hwp` 파일은 아직 못 받는 것이 맞습니다.
        > 그때는 브라우저에서 본문을 복사해 메뉴 **4번(공고 본문 붙여넣기)** 로 넣으면 됩니다.

  - type: input
    id: site
    attributes:
      label: 어느 사이트인가요?
      description: 사이트 이름만. 회사 자체 채용 페이지면 어떤 서비스인지(그리팅 · 나인하이어 · 리크루터 …)만 적어 주세요.
      placeholder: 예) 사람인 / 잡코리아 / 그리팅 / 나인하이어 / 리크루터 / 모르겠음
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: 주소 꼴 (회사 이름 부분은 반드시 ○○ 로 가려 주세요)
      description: 주소 전체가 아니라 **꼴**만 적어 주세요. 공고 번호나 뒤에 붙는 `?...` 부분은 빼고요.
      placeholder: 예) ○○.career.greetinghr.com  ·  www.saramin.co.kr/…/jobs/view
    validations:
      required: false

  - type: dropdown
    id: symptom
    attributes:
      label: 어떤 증상인가요?
      options:
        - "공고를 아예 못 받습니다 (오류가 납니다)"
        - "받긴 받는데 본문이 비어 있거나 거의 없습니다"
        - "메뉴·광고 같은 것이 본문에 섞여 들어옵니다"
        - "회사명 · 직무 · 마감일을 못 읽습니다"
        - "자소서 문항이 공고에 있는데 못 잡습니다"
        - "지원방법(플랫폼 · 홈페이지 · 이메일)을 틀리게 읽습니다"
        - "그 밖에"
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: 화면에 나온 글
      description: 회사명·공고 링크는 지우고 붙여넣어 주세요. `uv run jobfit diag --copy` 의 진단 정보를 같이 넣어 주셔도 좋습니다(개인정보 없음).
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 올리기 전에
      options:
        - label: 공고 링크와 회사명을 적지 않았습니다. 이력서·자소서 내용과 개인정보도 적지 않았습니다.
          required: true
