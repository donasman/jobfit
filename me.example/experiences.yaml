# 경험 은행 — 자소서·이력서에 쓸 경험을 카드 하나씩.
# 이 파일은 예시다. `jobfit init`이 me/ 로 복사한 뒤, 내 경험으로 바꿔 쓴다. me/ 는 배포·커밋에서 빠진다.
#
# 규칙
# - 같은 경험은 카드 하나로. 쓰임이 다르면 usable_for 로 나눈다.
# - facts 에는 사람이 확정한 수치·기간·고유 사실만 적는다. 초안에 쓰이는 숫자는 전부 여기 있어야 한다(lint가 검사).
# - verified: false 카드는 초안에 쓰이되 report 에 "확인 필요"로 표시된다.
# - tags 는 data/synonyms.yaml 의 대표 표기를 쓴다(`jobfit exp check`가 알려 준다).

- id: exp-order-api-latency
  title: 주문 조회 API 응답 시간 개선
  period: 2025-03 ~ 2025-05
  org: 예시 커머스 사내 프로젝트
  role: 백엔드 개발 담당(2인 중 1인)
  tags: [Java, Spring Boot, JPA, MySQL, Redis, 성능 최적화]
  summary: "N+1 조회를 제거하고 캐시를 붙여 주문 조회 API p95 응답 시간을 줄인 경험"
  star:
    situation: 주문 목록 화면이 느리다는 CS가 반복됐고, 조회 API 가 주문당 상품을 따로 조회하고 있었다.
    task: 화면 응답 시간을 1초 안으로 줄이되 기존 API 계약은 바꾸지 않는다.
    action: 쿼리 로그로 N+1 을 확인하고 fetch join 과 배치 사이즈로 묶었다. 변하지 않는 상품 정보는 Redis 에 캐시했다. 부하 테스트로 전후를 비교했다.
    result: p95 응답 시간이 줄었고 DB 쿼리 수가 주문당 1건으로 고정됐다. 이후 같은 패턴을 다른 조회 API 두 곳에 적용했다.
  facts:
    - "p95 응답 시간 1.8초 → 0.4초"
    - "주문 1건당 DB 쿼리 21회 → 1회"
    - "부하 테스트 동시 사용자 200명 기준"
    - "목표: 화면 응답 1초 안"
  usable_for: [직무역량, 문제해결]
  verified: true

- id: exp-team-onboarding-doc
  title: 신규 팀원 온보딩 문서 정리
  period: 2025-07
  org: 예시 커머스 사내 프로젝트
  role: 작성 주도
  tags: [문서화, 협업, 커뮤니케이션]
  summary: "흩어진 로컬 실행 방법을 한 문서로 모아 신규 팀원 세팅 시간을 줄인 경험"
  star:
    situation: 새 팀원이 로컬 환경을 올리는 데 며칠이 걸렸고 질문이 같은 사람에게 몰렸다.
    task: 혼자서도 첫날 실행까지 되는 문서를 만든다.
    action: 세팅 과정을 처음부터 따라 하며 막힌 곳을 전부 기록하고, 자주 묻는 질문을 문서 끝에 모았다. 새 팀원 두 명에게 문서만 주고 따라 하게 해서 빠진 곳을 고쳤다.
    result: 다음 팀원은 문서만으로 첫날 실행에 성공했다.
  facts:
    - "세팅 소요 3일 → 1일"
  usable_for: [협업, 성장]
  verified: false
